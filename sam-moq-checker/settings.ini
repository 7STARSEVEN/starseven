; =====================================================================
;  SAM MOQ ORDER CHECKER - settings
;  Change the value after the = sign, save the file, run the tool again.
;  Lines starting with ; are notes and are ignored.
; =====================================================================
[settings]

; Your firm name (printed on the report)
company_name = Piston Agency, Nagpur

; How MOQ is counted:
;   group = add up all models (Gr Codes) of a group together  <- SAM's normal rule
;   model = each model must reach the MOQ on its own
count_mode = group

; Weekly purchase cap in Rupees (with or without commas). Report warns above this.
weekly_cap = 6,00,000

; Show MOQ groups that are not in this order at all?  yes / no
show_groups_not_ordered = yes

; Name and last date (DD-MM-YYYY) of the MOQ scheme in moq.csv.
; After this date the tool reminds you to update moq.csv. Leave date blank to switch off.
scheme_name = April-July 2026 (Pistons + Cylinder Kits)
scheme_end_date =

; SAM prints its own "Summary of MOQ Scheme" at the bottom of the order sheets.
; yes = warn if it does not match moq.csv (catches an old moq.csv after a new scheme)
check_scheme_in_order_file = yes

; Codes whose difference with SAM's PO summary you have already confirmed with SAM.
; (Bravo codes: difference already confirmed with SAM - so no warning.)
scheme_check_ignore = GR0329 GR0340 GR0474

; SAM pending-orders file. Leave blank = the tool uses the NEWEST Excel file in the
; "Pending" folder (next to this tool), or one next to the order file.
pending_file =

; Only count pending lines whose cust_name contains this text. Blank = all lines.
pending_customer =

; Warn if the pending-orders file is older than this many days
pending_max_age_days = 7

; Read only these sheets of the order file (comma separated). Blank = all sheets.
order_sheets =

; Open the report automatically after the check?  yes / no
open_report = yes

; ---------------- Stock cover (Tally Stock Summary) ----------------
; Check stock cover from Tally?  no = switched off (use only when Tally stock is reliable)
stock_check = no

; Stock file. Blank = the newest Excel file in the "Stock" folder.
stock_file =

; Months covered by the stock file. Blank = read from the file's period
; (e.g. "1-Oct-26 to 31-Oct-26").
stock_months =

; Cover in months (cover = (stock + open with SAM + this order) / monthly sales)
; SHORT below min  -> add pieces to reach target.  OVER above max -> cut to target.
min_cover_months = 1
target_cover_months = 1.5
max_cover_months = 3

; Also list selling sizes NOT in this order that are SHORT?  yes / no
stock_check_all_codes = yes
